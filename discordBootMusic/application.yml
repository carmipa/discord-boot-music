spring:
  security:
    oauth2:
      client:
        registration:
          # Você pode chamar o registro como quiser (ex: 'google', 'youtube-music-auth')
          google:
            client-id: SEU_CLIENT_ID_DO_GOOGLE
            client-secret: SEU_CLIENT_SECRET_DO_GOOGLE
            client-authentication-method: basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/oauth2/callback/google" # URL de retorno (callback)
            scope:
              - openid
              - profile
              - email
              # O escopo crucial para o YouTube. Pode ser necessário um escopo mais amplo dependendo da API.
              - https://www.googleapis.com/auth/youtube.readonly

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub